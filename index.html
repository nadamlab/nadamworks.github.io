<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
  <meta name="description" content="디자이너 Sena Lee의 프로필과 오늘의 플래너">
  <title>Sena Lee | Profile</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">

  <style>
    /* ============================================
       ① 색상 모음 — 플래너와 같은 색. 여기 값만 바꾸면 전체 색이 바뀌어요
       ============================================ */
    :root {
      --bg: #faf8f5;          /* 배경 (따뜻한 크림색) */
      --card: #ffffff;        /* 카드 */
      --soft: #f5f5f4;        /* 연한 칸 */
      --text: #292524;        /* 기본 글씨 */
      --muted: #a8a29e;       /* 흐린 글씨 */
      --line: rgba(0, 0, 0, 0.06);
      --accent: #059669;      /* 초록 (플래너 버튼 색) */
      --accent-soft: #ecfdf5;
      --accent-text: #065f46;
      --bar: #e7e5e4;         /* 빈 막대 */
      --amber-soft: #fef3c7;
      --amber-text: #92400e;
    }
    /* 휴대폰이 어두운 모드면 자동으로 어둡게 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card: #1c1917;
        --soft: #292524;
        --text: #f5f5f4;
        --muted: #78716c;
        --line: rgba(255, 255, 255, 0.08);
        --accent: #10b981;
        --accent-soft: #022c22;
        --accent-text: #a7f3d0;
        --bar: #292524;
        --amber-soft: #451a03;
        --amber-text: #fde68a;
      }
    }

    /* ============================================
       ② 기본 설정
       ============================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .page {
      max-width: 440px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 40px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 0 0 1px var(--line);
      animation: fadeUp 0.45s ease-out both;
    }
    .card:nth-child(3) { animation-delay: 0.06s; }
    .card:nth-child(4) { animation-delay: 0.12s; }
    .card:nth-child(5) { animation-delay: 0.18s; }
    .card-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ============================================
       ③ 맨 위 인사 + 프로필 카드
       ============================================ */
    .hello { font-size: 14px; color: var(--muted); }
    .hello b { color: var(--text); font-size: 24px; display: block; margin-top: 2px; }

    .profile { display: flex; align-items: center; gap: 16px; }
    .avatar {
      position: relative;
      width: 72px; height: 72px; flex-shrink: 0;
      border-radius: 24px;
      background: var(--accent-soft);
      color: var(--accent-text);
      display: grid; place-items: center;
      font-size: 24px; font-weight: 800; letter-spacing: 1px;
    }
    /* 아바타 옆에 붙은 작은 식물 배지 (내 플래너 식물) */
    .avatar .badge {
      position: absolute; right: -6px; bottom: -6px;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0,0,0,0.08);
      display: grid; place-items: center; font-size: 16px;
      animation: sway 4s ease-in-out infinite;
    }
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    .name { font-size: 22px; font-weight: 800; }
    .job {
      display: inline-block; margin-top: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: var(--soft); font-size: 12px; color: var(--muted);
    }
    /* 한 줄 대사 말풍선 (글자가 하나씩 타이핑돼요) */
    .quote {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 18px 18px 18px 6px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 15px; font-weight: 600;
      min-height: 46px;
    }
    .cursor { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: currentColor; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ============================================
       ④ 오늘의 나 (플래너 기록 연결)
       ============================================ */
    .today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { background: var(--soft); border-radius: 18px; padding: 14px; min-height: 92px; }
    .tile-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .tile-main { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .tile-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .big-emoji { font-size: 26px; line-height: 1; }
    .steps { display: flex; gap: 4px; margin-top: 8px; }
    .steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--bar); }
    .steps span.on { background: var(--accent); }
    .routine-row { grid-column: 1 / -1; min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .routine-emojis { font-size: 20px; letter-spacing: 2px; }
    .special { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber-text); font-size: 12px; }
    .empty { font-size: 14px; line-height: 1.6; color: var(--muted); text-align: center; padding: 8px 0; }

    /* ============================================
       ⑤ 능력치 막대
       ============================================ */
    .stat + .stat { margin-top: 14px; }
    .stat-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    .stat-head .num { color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar { height: 8px; border-radius: 999px; background: var(--bar); overflow: hidden; }
    .fill { height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 1s cubic-bezier(.2,.8,.2,1); }

    /* ============================================
       ⑥ 링크 3개
       ============================================ */
    .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; list-style: none; }
    .link {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 6px; border-radius: 18px;
      background: var(--soft); color: var(--text); text-decoration: none;
      transition: transform 0.15s;
    }
    .link:active { transform: scale(0.96); }
    .link svg { width: 26px; height: 26px; }
    .link-name { font-size: 13px; font-weight: 700; }
    .link-value { font-size: 10px; color: var(--muted); text-align: center; word-break: break-all; }

    /* ============================================
       ⑦ 플래너로 가는 큰 버튼
       ============================================ */
    .cta {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 58px; border-radius: 999px;
      background: var(--accent); color: #fff;
      font-size: 16px; font-weight: 700; text-decoration: none;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
      transition: transform 0.12s;
      animation: fadeUp 0.45s 0.24s ease-out both;
    }
    .cta:active { transform: scale(0.97); }
    .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: -6px; }
  </style>
</head>
<body>
  <main class="page">

    <!-- ===== 맨 위 인사 (시간대에 따라 바뀌어요) ===== -->
    <p class="hello"><span id="hello">안녕하세요</span><b>Sena Lee의 프로필</b></p>

    <!-- ===== 프로필 카드 ===== -->
    <section class="card">
      <div class="profile">
        <div class="avatar">SL<span class="badge" id="plantBadge">🌱</span></div>
        <div>
          <h1 class="name">Sena Lee</h1>
          <span class="job">Designer</span>
        </div>
      </div>
      <p class="quote"><span id="quote"></span><span class="cursor"></span></p>
    </section>

    <!-- ===== 오늘의 나: 같은 사이트의 플래너 기록을 읽어와요 ===== -->
    <section class="card">
      <h2 class="card-title">오늘의 나</h2>
      <div id="today"><p class="empty">기록을 불러오는 중…</p></div>
    </section>

    <!-- ===== 능력치 (숫자만 바꾸면 막대 길이도 바뀌어요) ===== -->
    <section class="card">
      <h2 class="card-title">능력치</h2>
      <div class="stat">
        <div class="stat-head"><span>직관력</span><span class="num">80</span></div>
        <div class="bar"><div class="fill" data-value="80"></div></div>
      </div>
      <div class="stat">
        <div class="stat-head"><span>효율성 추구</span><span class="num">70</span></div>
        <div class="bar"><div class="fill" data-value="70"></div></div>
      </div>
      <div class="stat">
        <div class="stat-head"><span>디자인 실무 능력</span><span class="num">70</span></div>
        <div class="bar"><div class="fill" data-value="70"></div></div>
      </div>
      <div class="stat">
        <div class="stat-head"><span>아이디어</span><span class="num">80</span></div>
        <div class="bar"><div class="fill" data-value="80"></div></div>
      </div>
    </section>

    <!-- ===== 링크 3개 ===== -->
    <section class="card">
      <h2 class="card-title">연락하기</h2>
      <ul class="links">
        <li>
          <a class="link" href="https://www.instagram.com/seungah.li/" target="_blank" rel="noopener">
            <!-- 카메라 모양 아이콘 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/>
            </svg>
            <span class="link-name">Instagram</span>
            <span class="link-value">@seungah.li</span>
          </a>
        </li>
        <li>
          <a class="link" href="mailto:nadamworks@gmail.com">
            <!-- 편지봉투 모양 아이콘 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/>
            </svg>
            <span class="link-name">Mail</span>
            <span class="link-value">nadamworks<br>@gmail.com</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://github.com/nadamworks" target="_blank" rel="noopener">
            <!-- 코드 괄호 </> 모양 아이콘 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 7 3 12l5 5M16 7l5 5-5 5M13.5 5l-3 14"/>
            </svg>
            <span class="link-name">GitHub</span>
            <span class="link-value">nadamworks</span>
          </a>
        </li>
      </ul>
    </section>

    <!-- ===== 플래너로 이동 ===== -->
    <a class="cta" href="../">🌱 오늘의 플래너 열기</a>
    <p class="hint">클릭과 체크만으로 하루를 기록해요</p>
  </main>

  <script>
    // ----- 바꾸고 싶은 값 -----
    const QUOTE = "One Step, One Core";   // ← 한 줄 대사를 바꾸고 싶으면 여기!

    // 플래너와 같은 기준 (플래너 index.html의 '설정'·'규칙'과 맞춰 두었어요)
    const MOOD = {
      great:      { color: "#4ade80", label: "맑음",       emoji: "😊", score: 1 },
      moodOnly:   { color: "#facc15", label: "기분은 좋음", emoji: "🙂", score: 0.7 },
      energyOnly: { color: "#7dd3fc", label: "몸은 괜찮음", emoji: "😐", score: 0.5 },
      low:        { color: "#c4b5fd", label: "쉬어가기",    emoji: "😴", score: 0.2 },
    };
    const PLANTS = {
      astrophytum: { name: "투구 선인장", emoji: "🌵" },
      potato:      { name: "감자",       emoji: "🥔" },
      alocasia:    { name: "알로카시아", emoji: "🌿" },
      basil:       { name: "바질",       emoji: "🌱" },
    };
    const STAGES = ["씨앗", "새싹", "어린 잎", "쑥쑥", "만개"];

    // ⓪ 플래너 버튼 주소 — 웹 사이트(네틀리파이 등)에서는 "../"가 플래너지만,
    //    파일을 더블클릭해서 열면(file://) "../"가 폴더 목록이 되므로 플래너 파일을 직접 가리켜요
    if (location.protocol === "file:") {
      document.querySelector(".cta").href = location.pathname.includes("001_MyProfile_261102")
        ? "../002_MyService_261103/4Files/index.html"   // 어제 만든 원본 폴더에서 열었을 때
        : "../index.html";                               // 4Files/profile 에서 열었을 때
    }

    // ① 시간대별 인사
    const hour = new Date().getHours();
    document.getElementById("hello").textContent =
      hour >= 5 && hour < 11 ? "좋은 아침이에요 ☀️" : hour < 18 && hour >= 11 ? "좋은 오후예요 🌤️" : "오늘 하루 고생했어요 🌙";

    // ② 한 줄 대사를 한 글자씩 타이핑
    const quoteEl = document.getElementById("quote");
    let i = 0;
    (function type() {
      if (i < QUOTE.length) {
        quoteEl.textContent += QUOTE[i++];
        setTimeout(type, 80);   // 숫자가 작을수록 빨라요
      }
    })();

    // ③ 능력치 막대 채우기 (0 → 점수)
    setTimeout(() => {
      document.querySelectorAll(".fill").forEach((bar) => (bar.style.width = bar.dataset.value + "%"));
    }, 300);

    // ④ 플래너 기록 읽기 — 같은 사이트(주소)에서 연 플래너의 저장소를 "읽기만" 해요
    //    플래너를 아직 안 열어봤으면 저장소를 새로 만들지 않고 빈 화면을 보여줘요
    async function readPlanner() {
      try {
        if (!indexedDB.databases) return null;
        const list = await indexedDB.databases();
        if (!list.some((d) => d.name === "click-planner")) return null;
      } catch {
        return null;
      }
      return new Promise((resolve) => {
        const req = indexedDB.open("click-planner");
        req.onerror = () => resolve(null);
        req.onsuccess = () => {
          const db = req.result;
          const names = ["profile", "routines", "dayLogs"];
          if (!names.every((n) => db.objectStoreNames.contains(n))) { db.close(); return resolve(null); }
          const tx = db.transaction(names, "readonly");
          const out = {};
          names.forEach((n) => { tx.objectStore(n).getAll().onsuccess = (e) => (out[n] = e.target.result); });
          tx.oncomplete = () => { db.close(); resolve(out); };
          tx.onerror = () => { db.close(); resolve(null); };
        };
      });
    }

    // 날짜 도구
    const pad = (n) => String(n).padStart(2, "0");
    const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
    const daysBetween = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 86400000) + 1;

    function moodKey(log) {
      if (!log || log.sleepOk == null || log.moodOk == null) return null;
      if (log.sleepOk && log.moodOk) return "great";
      if (log.moodOk) return "moodOnly";
      if (log.sleepOk) return "energyOnly";
      return "low";
    }
    const hasData = (l) => l.routineIds.length > 0 || l.sleepOk !== null || l.highlight || !!l.memo;

    // 식물 단계 = min(최근 30일 루틴 달성률 단계, 기록한 날 수 단계) — 플래너와 같은 규칙
    function plantStage(logs, activeCount, today) {
      const first = logs.filter(hasData).map((l) => l.date).sort()[0];
      if (!first) return { stage: 0, rate: 0 };
      const d = fromKey(today);
      const from30 = toKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 29));
      const start = from30 < first ? first : from30;
      const days = daysBetween(start, today);
      const inRange = logs.filter((l) => l.date >= start && l.date <= today);
      const checks = inRange.reduce((s, l) => s + l.routineIds.length, 0);
      const rate = activeCount ? Math.min(1, checks / (days * activeCount)) : 0;
      const byRate = rate < 0.15 ? 0 : rate < 0.35 ? 1 : rate < 0.55 ? 2 : rate < 0.75 ? 3 : 4;
      const n = inRange.filter(hasData).length;
      const byDays = n >= 14 ? 4 : n >= 7 ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0;
      return { stage: Math.min(byRate, byDays), rate };
    }

    // ⑤ "오늘의 나" 그리기
    async function showToday() {
      const box = document.getElementById("today");
      const data = await readPlanner();
      const today = toKey(new Date());
      const logs = data?.dayLogs ?? [];
      const plant = PLANTS[data?.profile?.find((p) => p.id === "me")?.plantType];

      if (!data || (!logs.some(hasData) && !plant)) {
        box.innerHTML = `<p class="empty">아직 플래너 기록이 없어요.<br>아래 버튼으로 첫 안부 인사를 해보세요 🌱</p>`;
        return;
      }

      const day = logs.find((l) => l.date === today);
      const mood = MOOD[moodKey(day)];
      const routines = (data.routines ?? []).filter((r) => !r.deleted);
      const activeCount = routines.filter((r) => r.isActive).length;
      const done = (day?.routineIds ?? []).map((id) => routines.find((r) => r.id === id)?.emoji).filter(Boolean);
      const { stage, rate } = plantStage(logs, activeCount, today);
      if (plant) document.getElementById("plantBadge").textContent = plant.emoji;

      box.innerHTML = `
        <div class="today-grid">
          <div class="tile">
            <p class="tile-label">오늘 기분</p>
            ${mood
              ? `<p class="tile-main"><span class="dot" style="background:${mood.color}"></span>${mood.label}</p>
                 <p class="tile-sub">${mood.emoji} 아침 인사로 기록</p>`
              : `<p class="tile-main">아직이에요</p><p class="tile-sub">플래너에서 안부 인사 💬</p>`}
          </div>
          <div class="tile">
            <p class="tile-label">내 식물</p>
            ${plant
              ? `<p class="tile-main"><span class="big-emoji">${plant.emoji}</span>${STAGES[stage]}</p>
                 <div class="steps">${STAGES.map((_, i) => `<span class="${i <= stage ? "on" : ""}"></span>`).join("")}</div>
                 <p class="tile-sub">${plant.name} · 30일 달성 ${Math.round(rate * 100)}%</p>`
              : `<p class="tile-main">아직 없어요</p><p class="tile-sub">플래너 프로필 탭에서 골라요</p>`}
          </div>
          <div class="tile routine-row">
            <div>
              <p class="tile-label">오늘 체크한 루틴</p>
              <p class="tile-main">${done.length ? `${done.length}개 완료` : "아직 체크 전"}</p>
            </div>
            <span class="routine-emojis">${done.join("")}</span>
          </div>
        </div>
        ${day?.highlight ? `<span class="special">💡 오늘은 특별한 날</span>` : ""}`;
    }
    showToday();

    // 플래너에 다녀오면(뒤로 가기 포함) 최신 기록으로 다시 그리기
    window.addEventListener("pageshow", (e) => e.persisted && showToday());
    document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && showToday());
  </script>
</body>
</html>
